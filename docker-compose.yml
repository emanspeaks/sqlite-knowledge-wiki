name: sqlite-knowledge-wiki

x-wiki: &wiki
  image: sqlite-knowledge-wiki:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - wiki-data:/var/www/data
    - wiki-images:/var/www/html/images

services:
  wiki:
    <<: *wiki
    # Every input of the image is pinned in the Dockerfile; there are no
    # build arguments to set here.
    build:
      context: .
    environment:
      # Page views do not run jobs; the jobrunner service does.
      MW_JOB_RUN_RATE: ${MW_JOB_RUN_RATE:-0}
      # The first run's admin password, from the secret below rather than
      # the environment, where it would stay for the container's life
      MW_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    ports:
      # Bound to loopback by default: put your reverse proxy in front of it.
      - "${WIKI_BIND:-127.0.0.1:8080}:80"

  jobrunner:
    <<: *wiki
    command: jobrunner
    depends_on:
      wiki:
        condition: service_healthy
    healthcheck:
      disable: true

# Read on the first run only; afterwards the file may be emptied, but it must
# exist (README, "Quick start").
secrets:
  admin_password:
    file: ${MW_ADMIN_PASSWORD_SECRET:-./admin-password.txt}

volumes:
  wiki-data:
  wiki-images:
