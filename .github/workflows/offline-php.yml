# Builds the offline viewer's PHP with Zig alone and runs it on Windows.
name: offline-php

on:
  workflow_dispatch:
  push:
    branches: [offline-exe]
    paths: ['offline/php/**', '.github/workflows/offline-php.yml']

env:
  ZIG_VERSION: 0.17.1

jobs:
  cross-build:
    name: Cross-compile on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned releases, so a build does not depend on every upstream
      # download site answering.
      - uses: actions/cache@v4
        with:
          path: offline/php/zig-pkg
          key: zig-pkg-${{ hashFiles('offline/php/build.zig.zon') }}
      - run: pip install ziglang==$ZIG_VERSION
      - name: zig build (Debug)
        working-directory: offline/php
        run: python3 -m ziglang build --prefix zig-out/debug --summary all
      - name: zig build (ReleaseFast)
        working-directory: offline/php
        run: python3 -m ziglang build -Doptimize=ReleaseFast --prefix zig-out/release --summary all
      - uses: actions/upload-artifact@v4
        with:
          name: php-embed-smoke-cross
          path: |
            offline/php/zig-out/debug/bin
            offline/php/zig-out/release/bin

  windows:
    name: Run on Windows
    runs-on: windows-latest
    needs: cross-build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: php-embed-smoke-cross
          path: cross
      - name: Test the Debug build
        run: |
          cross/debug/bin/php-embed-smoke.exe offline/php/test/smoke.php > debug.out || { cat debug.out; exit 1; }
          cat debug.out
          diff --strip-trailing-cr offline/php/test/smoke.expected debug.out
      - name: Test the ReleaseFast build
        if: always()
        run: |
          cross/release/bin/php-embed-smoke.exe offline/php/test/smoke.php > release.out || { cat release.out; exit 1; }
          cat release.out
          diff --strip-trailing-cr offline/php/test/smoke.expected release.out

  windows-native:
    name: Build and run on Windows
    runs-on: windows-latest
    needs: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The pinned releases, so a build does not depend on every upstream
      # download site answering.
      - uses: actions/cache@v4
        with:
          path: offline/php/zig-pkg
          key: zig-pkg-${{ hashFiles('offline/php/build.zig.zon') }}
      - run: pip install ziglang==$ZIG_VERSION
      - name: zig build
        working-directory: offline/php
        run: python -m ziglang build -Doptimize=ReleaseFast --summary all
      - name: Test the natively built program
        run: |
          offline/php/zig-out/bin/php-embed-smoke.exe offline/php/test/smoke.php | tee native.out
          diff --strip-trailing-cr offline/php/test/smoke.expected native.out
