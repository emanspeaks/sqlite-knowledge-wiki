name: CI

# Modeled on skein's and zfls's ci.yml. Every pull request into main and every
# push to main builds the Windows program (cross-compiled on Linux, and built
# on Windows itself) and runs its tests on Windows, builds the wiki's image and
# tests the wiki through its API, and checks zig fmt, the Markdown and the
# requirements (skein check). Pushes to dev and pull requests
# into it are not run: dev is checked as a whole by the pull request that
# releases it (to main), which each merge into dev restarts; start the
# workflow by hand on a branch to check it alone
# (`gh workflow run ci.yml --ref <branch>`). A pull request that only changes
# documentation (docs-only.txt) is linted and nothing else. A pull request
# that only changes the files listed in no-ci.txt (editor settings) skips the
# checks; the "CI" job, the check main's ruleset requires, passes then too.
#
# A push to main of a version (VERSION) that has no tag yet is released, when
# something a release ships has changed since the last one (changes.sh): the
# commit is tagged, a GitHub release gets the packages, and the next version
# is begun on dev.
#
# What a release holds:
#   sqlite-knowledge-wiki-vX-server.zip   the files to deploy the wiki
#                                         service; the image is built where
#                                         it is deployed
#   sqlite-knowledge-wiki-vX-php-runtime-test-windows-x86_64.zip
#                                         the Windows program, with the
#                                         license text of every third-party
#                                         component. For now it is the PHP
#                                         runtime's test program: the offline
#                                         viewer is not written yet.
#   sqlite-knowledge-wiki-vX-sbom.cdx.json  the bill of materials
#   LICENSE, SHA256SUMS, and SHA256SUMS.asc when GPG signing is on
#
# Signing, as skein's and zfls's ci.yml do it: only a release, and a run
# started by hand with the `sign` input, signs the program (never a pull
# request: signings are limited per month). compile builds it unsigned;
# sign-windows signs it (Azure Artifact Signing); package then archives the
# signed program. The signing job is skipped while its configuration is unset
# (SIGN_AZURE_CLIENT_ID and the other SIGN_* variables), and the program stays
# unsigned; a signing job that fails fails the run. The release job signs
# SHA256SUMS with GPG and attests the files, each while its variable
# (RELEASE_GPG_SIGNING, RELEASE_ATTESTATIONS) is true.

on:
  push:
    # (not dev: see the top)
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the program, as a release does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: 0.17.1
  # the released skein that checks the requirements, and its archive's SHA-256
  SKEIN_VERSION: 0.1.1
  SKEIN_SHA256: 26a539071fead0bd27208d41c50017fce78045578fa5558711f1ce3f3342acac

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
      scope: ${{ steps.changes.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # matches, ships, no_ci, docs_only
          source .github/workflows/changes.sh

          # A pull request that only changes files of no-ci.txt skips CI.
          # One that only changes documentation (docs-only.txt) is linted.
          # Pushes to main and runs started by hand always run everything.
          ci=true
          scope=full
          if [ "$EVENT" = pull_request ]; then
            ci=false
            scope=docs
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if matches "$f" "${no_ci[@]}"; then continue; fi
              ci=true
              if ships "$f" || ! matches "$f" "${docs_only[@]}"; then scope=full; fi
              if [ "$scope" = full ]; then echo "changed: $f"; break; fi
            done <<< "$(git diff --name-only "$BASE_SHA...HEAD")"
          fi
          {
            echo "ci=$ci"
            echo "scope=$scope"
          } >> "$GITHUB_OUTPUT"
          if [ "$ci" = false ]; then
            echo "Only files of no-ci.txt changed; skipping the checks." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$scope" = docs ]; then
            echo "Only documentation changed: lint only." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # The version, from VERSION, and whether this run releases it: a push to
  # main of a version that has no tag yet.
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sign: ${{ steps.version.outputs.sign }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SIGN: ${{ inputs.sign }}
          SIGN_WINDOWS: ${{ vars.SIGN_AZURE_CLIENT_ID }}
        run: |
          version=$(bash .github/workflows/version.sh)
          release=false
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            # matches, exempt, shipped_changes
            source .github/workflows/changes.sh
            last=$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)
            if [ -z "$last" ]; then
              release=true
            else
              shipped=$(shipped_changes "$last")
              if [ -n "$shipped" ]; then
                release=true
                { echo "Changed since $last:"; echo "$shipped" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Nothing that a release ships has changed since $last: no release." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          # signing: for a release, or a run started by hand that asks, when
          # it is configured
          sign=false
          if [ "$release" = true ] || { [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_SIGN" = true ]; }; then
            if [ -n "$SIGN_WINDOWS" ]; then
              sign=true
            else
              echo "::warning::signing is not configured (SIGN_AZURE_CLIENT_ID); the program stays unsigned"
            fi
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "sign=$sign"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "v$version, release: $release, sign: $sign" | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: zig fmt
        working-directory: offline/php
        run: zig fmt --check build.zig build sources.zig icu_sources.zig components.zig

      - name: Markdown
        run: npx --yes markdownlint-cli2@0.24.2 "**/*.md"

      # the requirements, with the released skein
      - name: skein check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="skein-v$SKEIN_VERSION-x86_64-linux"
          gh release download "v$SKEIN_VERSION" --repo chasingdaylight/skein -p "$name.tar.gz" -D "$RUNNER_TEMP"
          echo "$SKEIN_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$name.tar.gz"
          "$RUNNER_TEMP/$name/bin/skein" check

  # The Windows program, cross-compiled on Linux, unsigned: its package
  # folder (the program, the licenses, the bill of materials, the test
  # script), and a debug build for the tests, as a tar. sign-windows signs the
  # program in it; package archives it.
  compile:
    name: Compile
    needs: [changes, version]
    if: needs.changes.outputs.ci == 'true' && needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # the pinned releases, so a build does not depend on every upstream
      # download site answering
      - uses: actions/cache@v4
        with:
          path: offline/php/zig-pkg
          key: zig-pkg-${{ hashFiles('offline/php/build.zig.zon') }}
          # shared with build-windows, which restores it
          enableCrossOsArchive: true

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        working-directory: offline/php
        run: |
          zig build --prefix zig-out/debug --summary all
          zig build -Doptimize=fast --prefix zig-out/release --summary all
          zig build licenses --prefix zig-out/release
          # the SBOM needs the Composer lock, which the Server job writes when
          # it is missing; the Package job then fails, without blocking the
          # tests here
          if [ -f ../../composer/composer.lock ]; then
            zig build sbom -Dversion="$VERSION" --prefix zig-out/release
          else
            echo "::warning::composer/composer.lock is not committed: no SBOM"
          fi

      - name: Stage
        run: |
          name="sqlite-knowledge-wiki-v$VERSION-php-runtime-test-windows-x86_64"
          mkdir -p "out/$name" out/debug
          cp offline/php/zig-out/release/bin/php-embed-smoke.exe LICENSE "out/$name/"
          [ ! -f offline/php/zig-out/release/sbom.cdx.json ] || cp offline/php/zig-out/release/sbom.cdx.json "out/$name/"
          cp -r offline/php/zig-out/release/licenses "out/$name/third-party-licenses"
          cp offline/php/test/smoke.php offline/php/test/smoke.expected "out/$name/"
          # the debug build keeps its symbols, for the crash handler's traces
          cp offline/php/zig-out/debug/bin/php-embed-smoke.* out/debug/
          tar -C out -cf unsigned.tar .
          tar -tvf unsigned.tar

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: unsigned.tar
          if-no-files-found: error

  # The tests, on Windows, of the programs compile built
  test:
    name: Test on Windows
    needs: compile
    runs-on: windows-2025
    # the tests take seconds; a hang should not hold a runner for hours
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: unsigned
          path: unsigned

      - name: Unpack
        run: |
          mkdir out
          tar -C out -xf unsigned/unsigned.tar

      - name: Test the debug build
        run: |
          out/debug/php-embed-smoke.exe offline/php/test/smoke.php | tee debug.out
          diff --strip-trailing-cr offline/php/test/smoke.expected debug.out

      - name: Test the release build
        if: always()
        run: |
          out/sqlite-knowledge-wiki-v*/php-embed-smoke.exe offline/php/test/smoke.php | tee release.out
          diff --strip-trailing-cr offline/php/test/smoke.expected release.out

  # The same build on Windows itself, where it is developed
  build-windows:
    name: Build on Windows
    needs: changes
    if: needs.changes.outputs.ci == 'true' && needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: offline/php/zig-pkg
          key: zig-pkg-${{ hashFiles('offline/php/build.zig.zon') }}
          enableCrossOsArchive: true

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        working-directory: offline/php
        run: zig build -Doptimize=fast --summary all

      - name: Test
        run: |
          offline/php/zig-out/bin/php-embed-smoke.exe offline/php/test/smoke.php | tee native.out
          diff --strip-trailing-cr offline/php/test/smoke.expected native.out

  # The wiki service: the image built from the Dockerfile, then tested through
  # its API by tests/server/check.sh: a fresh install, a restart (the data
  # persists and nothing is installed again), and read-only mode. The image is
  # built to be tested, not published. Without a committed Composer lock it
  # resolves one, uploads it as the composer-lock artifact, and fails.
  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.ci == 'true' && needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADMIN_USER: Admin
      ADMIN_PASSWORD: ci-only-password-1234
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        id: build
        run: |
          if [ -f composer/composer.lock ]; then
            docker compose build
            echo "lock=committed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::composer/composer.lock is not committed; resolving one"
            docker compose build --build-arg COMPOSER_UPDATE=1
            docker run --rm --entrypoint cat sqlite-knowledge-wiki:latest /var/www/html/composer.lock > composer.lock
            echo "lock=new" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.lock == 'new'
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error

      - name: Configure
        run: |
          sed -e 's|^MW_SERVER=.*|MW_SERVER=http://localhost:8080|' .env.example > .env
          printf '%s' "$ADMIN_PASSWORD" > admin-password.txt
          cat > "$RUNNER_TEMP/healthy.sh" << 'SH'
          for i in $(seq 1 180); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q wiki)" 2> /dev/null || true)
            [ "$s" = healthy ] && exit 0
            sleep 5
          done
          echo "::error::the wiki did not become healthy"
          docker compose logs
          exit 1
          SH

      - name: A fresh install, edits and queries
        run: |
          docker compose up -d
          bash "$RUNNER_TEMP/healthy.sh"
          docker compose logs wiki | grep -F "[wiki] First-run setup complete"
          bash tests/server/check.sh write

      - name: After a restart, the data is there and nothing is installed again
        run: |
          docker compose down
          docker compose up -d
          bash "$RUNNER_TEMP/healthy.sh"
          if docker compose logs wiki | grep -F "[wiki] No database"; then
            echo "::error::the wiki was installed again"
            exit 1
          fi
          bash tests/server/check.sh read

      - name: Read-only mode
        run: |
          echo "MW_READ_ONLY=Read-only snapshot" >> .env
          docker compose up -d
          bash "$RUNNER_TEMP/healthy.sh"
          bash tests/server/check.sh read-only

      - name: The logs
        if: always()
        run: docker compose logs --no-color | tail -200

      - name: A lock must be committed
        if: steps.build.outputs.lock == 'new'
        run: |
          echo "::error::commit the composer-lock artifact of this run as composer/composer.lock"
          exit 1

  # Azure Artifact Signing, through the Entra identity whose federated
  # credential trusts this repository's main (and a branch while a signing
  # change is tested); skipped while SIGN_AZURE_CLIENT_ID is unset
  sign-windows:
    name: Sign the program
    needs: [version, compile, test]
    if: ${{ !cancelled() && needs.compile.result == 'success' && needs.test.result == 'success' && needs.version.outputs.sign == 'true' && vars.SIGN_AZURE_CLIENT_ID != '' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned

      # the package only: the debug build is not released, and is not signed
      - name: Unpack the package
        run: |
          mkdir pkg
          tar -C pkg -xf unsigned/unsigned.tar --wildcards "./sqlite-knowledge-wiki-v*-windows-x86_64/*"
          ls pkg

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SIGN_AZURE_SUBSCRIPTION_ID }}

      # SHA-256 and a trusted timestamp: the certificates last 3 days, the
      # signature must stay valid after
      - name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\pkg
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem pkg -Recurse -Filter *.exe)
          if ($exes.Count -ne 1) { throw "expected 1 program, found $($exes.Count)" }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "$($exe.FullName): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($exe.FullName) is not validly signed: $($sig.Status)" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "$($exe.FullName) has no timestamp" }
          }

      - name: The signed program passes its tests
        run: |
          cd pkg/sqlite-knowledge-wiki-v*-windows-x86_64
          ./php-embed-smoke.exe smoke.php | tee "$RUNNER_TEMP/signed.out"
          diff --strip-trailing-cr smoke.expected "$RUNNER_TEMP/signed.out"

      - name: Stage the signed package
        run: tar -C pkg -cf signed-windows.tar .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: signed-windows.tar
          if-no-files-found: error

  # What a release publishes: the server's deployment files, the Windows
  # program, signed where the signing job ran, the bill of materials and the
  # license.
  package:
    name: Package
    needs: [version, compile, test, sign-windows]
    # a signing job that was skipped (not asked for, or not configured)
    # leaves the program unsigned; one that failed fails the run
    if: >-
      ${{ !cancelled() && needs.compile.result == 'success' && needs.test.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.sign-windows.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS: ${{ needs.sign-windows.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: unsigned
          path: unsigned

      - uses: actions/download-artifact@v8
        if: env.WINDOWS == 'success'
        with:
          name: signed-windows
          path: signed

      # The signed program replaces the unsigned one. A signing job that
      # succeeded must have its program used, or the release would ship an
      # unsigned one.
      - name: The program to package
        run: |
          mkdir out
          tar -C out -xf unsigned/unsigned.tar
          rm -r out/debug
          if [ "$WINDOWS" = success ]; then
            [ -f signed/signed-windows.tar ] || { echo "::error::the program was signed but its signed copy was not found"; exit 1; }
            tar -C out -xf signed/signed-windows.tar
          fi
          echo "signed: windows $WINDOWS"

      - name: The packages
        run: |
          name="sqlite-knowledge-wiki-v$VERSION"
          win="$name-php-runtime-test-windows-x86_64"
          mkdir dist

          [ -f "out/$win/sbom.cdx.json" ] || { echo "::error::no SBOM: composer/composer.lock is not committed (see the Server job)"; exit 1; }

          # what deploying the wiki service needs, and nothing else
          mkdir "out/$name-server"
          cp Dockerfile docker-entrypoint.sh LocalSettings.php docker-compose.yml \
            .env.example .dockerignore README.md LICENSE "out/$name-server/"
          cp -r composer "out/$name-server/"
          cp "out/$win/sbom.cdx.json" "out/$name-server/"

          (cd out && zip -q -r -X "../dist/$name-server.zip" "$name-server")
          (cd out && zip -q -r -X "../dist/$win.zip" "$win")
          cp "out/$win/sbom.cdx.json" "dist/$name-sbom.cdx.json"
          cp LICENSE dist/LICENSE
          ls -l dist
          unzip -l "dist/$name-server.zip"
          unzip -l "dist/$win.zip"

      # a signing that succeeded must be what ships
      - name: The Windows package carries the signed program
        if: env.WINDOWS == 'success'
        run: |
          win="sqlite-knowledge-wiki-v$VERSION-php-runtime-test-windows-x86_64"
          tar -xOf signed/signed-windows.tar "./$win/php-embed-smoke.exe" > "$RUNNER_TEMP/signed.exe"
          unzip -p "dist/$win.zip" "$win/php-embed-smoke.exe" | cmp - "$RUNNER_TEMP/signed.exe"
          echo "the signed program"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  ci:
    name: CI
    # the one check main's ruleset requires: passes when every job passed or
    # was skipped for a change that needs none
    if: always()
    needs: [changes, version, lint, compile, test, build-windows, server, sign-windows, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, lint, test, build-windows, server, package]
    if: >-
      ${{ !cancelled() && needs.version.outputs.release == 'true'
      && needs.lint.result == 'success' && needs.test.result == 'success'
      && needs.build-windows.result == 'success' && needs.server.result == 'success'
      && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # the attestations of the release files
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check the packages
        run: |
          ls -l dist
          for f in server.zip php-runtime-test-windows-x86_64.zip sbom.cdx.json; do
            if [ ! -f "dist/sqlite-knowledge-wiki-v$VERSION-$f" ]; then
              echo "::error::no sqlite-knowledge-wiki-v$VERSION-$f"
              exit 1
            fi
          done
          [ -f dist/LICENSE ] || { echo "::error::no LICENSE"; exit 1; }

      - name: Tag the tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "sqlite-knowledge-wiki v$VERSION" "$SHA"
          git push origin "v$VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS)

      # A detached GPG signature of SHA256SUMS (the public key is
      # SIGNING-KEY.asc) and build attestations of the files: each skipped
      # while its repository variable is not true
      - name: Sign and attest the release files
        uses: ./.github/actions/release-integrity
        with:
          sign: ${{ vars.RELEASE_GPG_SIGNING }}
          attest: ${{ vars.RELEASE_ATTESTATIONS }}
          gpg-key: ${{ secrets.RELEASE_GPG_KEY }}
          gpg-passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: sqlite-knowledge-wiki v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          # 0.x: everything may still change
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') }}

  # The next version is begun on dev: main keeps the version it released. A
  # separate job, so that a push dev refuses does not stop the publishing.
  begin-next-version:
    name: Merge v${{ needs.version.outputs.version }} into dev and begin the next version
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # A fast-forward when dev has not moved, else a merge commit
      - name: Merge into dev and begin the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          for attempt in 1 2 3; do
            git fetch -q --tags origin dev
            git checkout -q -B dev origin/dev
            if ! git merge -q -m "Merge v$VERSION into dev [skip ci]" "$SHA"; then
              git merge --abort
              echo "::error::v$VERSION conflicts with dev; merge main into dev by hand and set the next version"
              exit 1
            fi
            version=$(bash .github/workflows/version.sh)
            if tagged "$version"; then
              next=$version
              while tagged "$next"; do
                IFS=. read -r ma mi pa <<< "$next"
                next="$ma.$mi.$((pa + 1))"
              done
              bash .github/workflows/version.sh set "$next"
              git commit -qam "Begin v$next development [skip ci]"
            fi
            if git push -q origin dev; then exit 0; fi
            echo "dev moved while merging; trying again"
          done
          echo "::error::could not push to dev"
          exit 1
