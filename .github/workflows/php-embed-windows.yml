# Feasibility build: a static, embeddable PHP for Windows with the extensions
# MediaWiki + Semantic MediaWiki + Wikibase need. Consumed by the offline viewer.
name: php-embed-windows

on:
  workflow_dispatch:
  push:
    branches: [offline-exe]
    paths: ['.github/workflows/php-embed-windows.yml']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: bcmath,calendar,ctype,dom,fileinfo,filter,iconv,intl,libxml,mbstring,opcache,pdo,pdo_sqlite,session,simplexml,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zlib

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Fetch static-php-cli
        run: curl.exe -fSL https://dl.static-php.dev/v3/spc-bin/nightly/spc-windows-x64.exe -o spc.exe

      - name: Doctor
        run: .\spc.exe doctor --auto-fix

      - name: Build PHP (cli + embed)
        run: .\spc.exe build:php "$env:PHP_EXTENSIONS" --build-cli --build-embed --dl-with-php=$env:PHP_VERSION --dl-prefer-binary -v

      - name: Smoke-test the CLI
        run: |
          .\buildroot\bin\php.exe -v
          .\buildroot\bin\php.exe -m
          .\buildroot\bin\php.exe -r "echo Collator::class, ' ', (new PDO('sqlite::memory:'))->query('select sqlite_version()')->fetchColumn(), PHP_EOL;"

      - name: List outputs
        if: always()
        run: |
          Get-ChildItem buildroot\lib, buildroot\bin -ErrorAction SilentlyContinue | Format-Table Name, Length
          dumpbin /nologo /dependents buildroot\bin\php.exe 2>$null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-embed-windows-x64
          path: |
            buildroot/lib
            buildroot/include
            buildroot/bin/php.exe
            buildroot/build-manifest.json
            log
          if-no-files-found: warn
