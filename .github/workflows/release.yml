name: Release

# Modelled on cesiumlang/zfls. VERSION holds the version the next release
# will have. A push to main whose version has no tag yet is built, tested on
# Windows, signed where signing is configured, packaged, tagged and published
# as release vVERSION. A push to main whose version is already tagged is
# built and tested but not released: bump VERSION to release again.
#
# For a pull request into main, or started by hand
# (`gh workflow run release.yml --ref BRANCH`), it does everything except
# sign, tag and publish, and leaves the packages as the `dist` artifact of
# the run, to look at before a release.
#
# What a release holds:
#   sqlite-knowledge-wiki-vX-server.zip        the files to deploy the wiki
#                                              service; the image is built
#                                              where it is deployed
#   sqlite-knowledge-wiki-vX-windows-x86_64.zip  the Windows program
#   sqlite-knowledge-wiki-vX-sbom.cdx.json     the bill of materials
#   LICENSE                                    this project's licence; the
#                                              Windows package also holds the
#                                              licence text of every
#                                              third-party component
#   SHA256SUMS, and SHA256SUMS.asc when GPG signing is on
#
# The Windows program is, for now, the PHP runtime's test program: the
# offline viewer is not written yet. Its package is named
# ...-php-runtime-test-windows-x86_64.zip until it is.
#
# Repository variables (all optional):
#   SIGN_AZURE_CLIENT_ID, SIGN_AZURE_TENANT_ID, SIGN_AZURE_SUBSCRIPTION_ID,
#   SIGN_ENDPOINT, SIGN_ACCOUNT, SIGN_PROFILE
#       Azure Artifact Signing of the .exe. Without SIGN_AZURE_CLIENT_ID the
#       program is released unsigned.
#   RELEASE_GPG_SIGNING = true, with the secrets RELEASE_GPG_KEY (the signing
#   subkey, armored and base64-encoded) and RELEASE_GPG_PASSPHRASE
#       A detached GPG signature of SHA256SUMS, checked against the public
#       key in SIGNING-KEY.asc at the root of the repository.
#   RELEASE_ATTESTATIONS = true
#       GitHub build attestations of the release files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.1

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::'$version' is not a version like 1.2.3"
            exit 1
          fi
          release=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released; this run builds and tests only." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              release=true
            fi
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned releases, so a build does not depend on every upstream
      # download site answering.
      - uses: actions/cache@v4
        with:
          path: offline/php/zig-pkg
          key: zig-pkg-${{ hashFiles('offline/php/build.zig.zon') }}

      - uses: randyos-org/setup-zig@bd9719185e5350e25dfaed832f37f7e869f47469 # node24 branch: v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      # Cross-compiled here; the test job runs it on Windows.
      - name: Build the Windows program and the bill of materials
        working-directory: offline/php
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          zig build sbom licenses -Dversion="$VERSION"

      - name: Stage
        run: |
          mkdir unsigned
          cp offline/php/zig-out/bin/php-embed-smoke.exe unsigned/
          cp offline/php/zig-out/sbom.cdx.json unsigned/
          cp -r offline/php/zig-out/licenses unsigned/third-party-licenses

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: unsigned
          if-no-files-found: error

  test:
    name: Test on Windows
    needs: build
    runs-on: windows-2025
    # The tests take seconds; a hang should not hold a runner for hours.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned
      - name: Run the test script with the release binary
        run: |
          unsigned/php-embed-smoke.exe offline/php/test/smoke.php | tee out.txt
          diff --strip-trailing-cr offline/php/test/smoke.expected out.txt

  # Skipped, and the program stays unsigned, while SIGN_AZURE_CLIENT_ID is
  # not set.
  sign-windows:
    name: Sign the Windows program
    needs: [build, test]
    if: ${{ vars.SIGN_AZURE_CLIENT_ID != '' && github.event_name == 'push' }}
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: pkg

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SIGN_AZURE_SUBSCRIPTION_ID }}

      # SHA-256 and a trusted timestamp, so the signature stays valid after
      # the short-lived certificate expires
      - name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\pkg
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature pkg\php-embed-smoke.exe
          "$($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "not validly signed: $($sig.Status)" }
          if ($null -eq $sig.TimeStamperCertificate) { throw "no timestamp" }

      - name: The signed program still runs
        shell: bash
        run: pkg/php-embed-smoke.exe -r 'echo PHP_VERSION, PHP_EOL;'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: pkg
          if-no-files-found: error

  package:
    name: Package
    needs: [version, build, test, sign-windows]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-windows.result == 'success' && 'signed' || 'unsigned' }}
          path: bin

      - name: Assemble the packages
        run: |
          name="sqlite-knowledge-wiki-v$VERSION"
          mkdir dist

          # What deploying the wiki service needs, and nothing else.
          mkdir "$name-server"
          cp Dockerfile docker-entrypoint.sh LocalSettings.php docker-compose.yml \
             .env.example README.md LICENSE "$name-server/"
          cp bin/sbom.cdx.json "$name-server/"
          zip -r -X "dist/$name-server.zip" "$name-server"

          # The Windows program: for now the PHP runtime's test program.
          win="$name-php-runtime-test-windows-x86_64"
          mkdir "$win"
          cp bin/php-embed-smoke.exe LICENSE "$win/"
          cp -r bin/third-party-licenses "$win/"
          cp bin/sbom.cdx.json "$win/"
          cp offline/php/test/smoke.php offline/php/test/smoke.expected "$win/"
          zip -r -X "dist/$win.zip" "$win"

          cp bin/sbom.cdx.json "dist/$name-sbom.cdx.json"
          cp LICENSE dist/LICENSE
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # the attestations of the release files
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # A detached signature of SHA256SUMS, verified here the way a user
      # would: against the public key kept in the repository.
      - name: Sign SHA256SUMS (GPG)
        if: ${{ vars.RELEASE_GPG_SIGNING == 'true' }}
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$RELEASE_GPG_KEY" | base64 --decode | gpg --batch --import
          printf '%s' "$RELEASE_GPG_PASSPHRASE" > "$RUNNER_TEMP/pass"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" \
            --armor --detach-sign -o dist/SHA256SUMS.asc dist/SHA256SUMS
          rm "$RUNNER_TEMP/pass"
          export GNUPGHOME="$RUNNER_TEMP/verify"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import SIGNING-KEY.asc
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS

      - name: Attest the release files
        if: ${{ vars.RELEASE_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Tag the tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "sqlite-knowledge-wiki v$VERSION" "$SHA"
          git push origin "v$VERSION"

      - name: Publish the release
        run: |
          gh release create "v$VERSION" dist/* \
            --title "sqlite-knowledge-wiki v$VERSION" \
            --generate-notes --verify-tag
